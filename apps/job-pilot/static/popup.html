<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>JobPilot</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body { width: 360px; padding: 12px; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 10px 0; }
    .stat { border: 1px solid var(--line); border-radius: 8px; padding: 6px; text-align: center; }
    .stat b { display: block; font-size: 18px; }
    .stat span { font-size: 11px; color: var(--muted); }
    .need { border: 1px solid var(--line); border-left: 3px solid var(--danger); border-radius: 6px; padding: 6px 8px; margin-bottom: 6px; cursor: pointer; font-size: 12px; }
    .need.ok { border-left-color: var(--ok); }
    .need small { display: block; color: var(--muted); }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
    textarea { height: 64px; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="row" style="justify-content: space-between">
    <div><h1>JobPilot</h1><div class="muted" id="sub">—</div></div>
    <button id="pause">Pause</button>
  </div>
  <div class="stats">
    <div class="stat"><b id="n-needs">0</b><span>need you</span></div>
    <div class="stat"><b id="n-running">0</b><span>active</span></div>
    <div class="stat"><b id="n-queued">0</b><span>queued</span></div>
    <div class="stat"><b id="n-applied">0</b><span>applied</span></div>
  </div>
  <div id="needs"></div>
  <div class="actions">
    <button class="primary" id="fill">Autofill this tab</button>
    <button id="queue-tab">Queue this tab</button>
    <button id="applied">Mark tab applied</button>
    <button id="tracker">Open tracker</button>
  </div>
  <textarea id="urls" placeholder="Paste job URLs (one per line) to queue them…"></textarea>
  <div class="row" style="justify-content: space-between; margin-top: 6px">
    <button id="add">Queue URLs</button>
    <button id="options">Profile &amp; settings</button>
  </div>
  <div class="toast" id="toast"></div>
  <script src="popup.js"></script>
</body>
</html>
