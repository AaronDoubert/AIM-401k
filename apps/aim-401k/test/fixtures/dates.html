<!doctype html>
<html><head><title>Apply - Globex</title></head>
<body><main>
  <h1>Data Engineer</h1>
  <form>
    <div><label for="avail">Available start date *</label><input id="avail" type="date" required></div>
    <div><label for="signed">Date</label><input id="signed" placeholder="MM/DD/YYYY"></div>
    <div><label for="dob">Date of birth</label><input id="dob" type="date"></div>
    <div><label for="pick">Earliest start date</label><input id="pick" class="flatpickr-input" readonly></div>

    <h3>Work Experience 1</h3>
    <div><label for="w1t">Job Title *</label><input id="w1t" required></div>
    <div><label for="w1c">Company *</label><input id="w1c" required></div>
    <div data-automation-id="formField-startDate"><label id="w1fl">From *</label>
      <div role="group" aria-labelledby="w1fl">
        <input data-automation-id="dateSectionMonth-input" aria-label="Month" placeholder="MM">
        <input data-automation-id="dateSectionYear-input" aria-label="Year" placeholder="YYYY">
      </div></div>
    <div><label><input type="checkbox" id="w1cur"> I currently work here</label></div>

    <h3>Work Experience 2</h3>
    <div><label for="w2t">Job Title</label><input id="w2t"></div>
    <div><label for="w2c">Company</label><input id="w2c"></div>
    <div><label for="w2from">From (MM/YYYY)</label><input id="w2from"></div>
    <div><label for="w2to">To (MM/YYYY)</label><input id="w2to"></div>

    <h3>Education</h3>
    <div><label for="sch">School or University</label><input id="sch"></div>
    <fieldset><legend>Graduation date</legend>
      <select name="grad_month"><option value="">Month</option><option value="1">January</option><option value="2">February</option><option value="3">March</option><option value="4">April</option><option value="5">May</option><option value="6">June</option><option value="7">July</option><option value="8">August</option><option value="9">September</option><option value="10">October</option><option value="11">November</option><option value="12">December</option></select>
      <select name="grad_year"><option value="">Year</option><option>2014</option><option>2015</option><option>2016</option><option>2017</option></select>
    </fieldset>
  </form>
</main></body></html>
