<!doctype html>
<html lang="en" data-chud="1">
<head>
  <meta charset="utf-8" />
  <title>AIM-401k</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="popup">
  <div class="hud">
    <div class="head">
      <div class="brand">
        <div>
          <h1><img class="wordmark" src="brand/aim401k-wordmark-offwhite.svg" alt="AIM-401k" width="123" height="20" /></h1>
          <div class="micro" data-copy="theme.brand.line">Autonomous Employment Acquisition System</div>
        </div>
      </div>
    </div>

    <div class="statusline"><span class="pip" id="pip"></span><span id="sub" aria-live="polite">—</span><span class="clock" id="clock"></span><button id="pause" data-copy="theme.pause">PAUSE</button></div>

    <button id="spotter" class="spotter" type="button" role="switch" aria-checked="true">
      <span class="pip" id="spotter-lamp"></span>
      <span><span class="t" data-copy="theme.popup.spotter">SPOTTER</span><span class="s" id="spotter-sub"></span></span>
      <span class="state" id="spotter-state">ON</span>
    </button>

    <div id="setup" class="need ok frame" role="button" tabindex="0" style="display:none">
      <b data-copy="theme.popup.setup.title">SETUP INCOMPLETE</b>
      <small data-copy="theme.popup.setup.body">Import your resume so AIM-401k can fill forms.</small>
    </div>

    <div id="stages"></div>

    <div class="section-label micro" id="holding-label" hidden></div>
    <div id="needs"></div>

    <button id="warroom" class="warroom-btn" type="button">
      <span class="pip" id="wr-lamp"></span>
      <span><span class="t" data-copy="theme.warroom">WAR ROOM</span><span class="s" data-copy="theme.warroom.sub">Live picture: tracks, holds, ops log</span></span>
      <span class="go" aria-hidden="true">→</span>
    </button>

    <div class="actions">
      <button class="primary" id="fill" data-copy="theme.popup.fill">ENGAGE THIS TAB</button>
      <button id="queue-tab" data-copy="theme.popup.queueTab">QUEUE THIS TAB</button>
      <button id="applied" data-copy="theme.popup.applied">LOG SPLASH</button>
      <button id="tracker" data-copy="theme.tracker">TRACKER</button>
    </div>

    <div class="arm">
      <textarea id="urls" data-copy-ph="theme.popup.urls.ph" placeholder="Paste job URLs (one per line) to queue them" aria-label="Job URLs"></textarea>
      <button id="add" data-copy="theme.popup.queueUrls">QUEUE</button>
    </div>
  </div>
  <div class="foot">
    <button id="options" class="ghost" data-copy="theme.settings">SETTINGS</button>
    <label class="switch"><input type="checkbox" id="ui-plain" /><span data-copy="theme.ui.plain">PLAIN MODE</span></label>
    <label class="switch"><input type="checkbox" id="ui-sound" /><span data-copy="theme.ui.sound">SOUND</span></label>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <script src="popup.js"></script>
</body>
</html>
