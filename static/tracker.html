<!doctype html>
<html lang="en" data-chud="1">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AIM-401k Tracker</title>
  <link rel="icon" href="icons/icon-32.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="tracker shell">
  <div class="shell-banner"><span data-copy="warroom.banner">CUI // CONTROLLED UNEMPLOYMENT INFORMATION</span></div>

  <header class="shell-head">
    <div class="brand">
      <img class="wordmark" src="brand/aim401k-wordmark-offwhite.svg" alt="AIM-401k" width="123" height="20" />
      <div class="shell-title">
        <h1 data-copy="theme.tracker">TRACKER</h1>
        <time id="clock" class="shell-clock">——————Z———</time>
      </div>
    </div>
    <button id="caution" class="shell-caution" type="button" data-lit="false">
      <span class="c-name" data-copy="warroom.caution">MASTER CAUTION</span>
      <span id="caution-n" class="c-n"></span>
    </button>
    <nav class="shell-ctl" aria-label="Tracker controls">
      <button id="warroom" class="shell-btn" type="button" data-copy="theme.warroom">WAR ROOM</button>
      <button id="pause" class="shell-btn" type="button" aria-pressed="false" data-copy="theme.pause">PAUSE</button>
      <button id="csv" class="shell-btn" type="button" data-copy="theme.tracker.csv">EXPORT CSV</button>
      <button id="settings" class="shell-btn" type="button" data-copy="theme.settings">SETTINGS</button>
    </nav>
  </header>

  <main>
    <section class="shell-totals" aria-label="Stages">
      <div class="stats" id="stats"></div>
    </section>

    <section class="listing">
      <div class="shell-sec-head">
        <h2 data-copy="theme.tracker.list">ALL TARGETS</h2>
        <div class="seg" role="group" aria-label="View">
          <button id="view-table" type="button" aria-pressed="true" data-copy="theme.view.table">TABLE</button>
          <button id="view-board" type="button" aria-pressed="false" data-copy="theme.view.board">BOARD</button>
        </div>
        <input id="q" type="search" data-copy-ph="theme.tracker.search" placeholder="Search company, title, notes" aria-label="Search" />
        <select id="filter" aria-label="Filter by status"></select>
        <span class="spacer"></span>
        <button id="start-saved" class="shell-btn" type="button" data-copy="theme.tracker.queueSaved">QUEUE ALL SAVED</button>
        <button id="clear-done" class="shell-btn danger" type="button" data-copy="theme.tracker.clear">CLEAR FAULTS</button>
        <button id="add-toggle" class="shell-btn" type="button" aria-expanded="false" aria-controls="add" data-copy="theme.tracker.add">+ ADD TARGETS</button>
      </div>

      <div class="add" id="add" hidden>
        <textarea id="urls" rows="3" aria-label="Job URLs" placeholder="https://boards.greenhouse.io/acme/jobs/123&#10;https://jobs.lever.co/acme/abc"></textarea>
        <div class="add-side">
          <span class="muted" data-copy="theme.tracker.acquire.hint">Paste job posting or application URLs. Any text with links works.</span>
          <div class="btns">
            <button class="primary" id="queue" type="button" data-copy="theme.tracker.queue">QUEUE</button>
            <button id="save" type="button" data-copy="theme.tracker.save">SAVE FOR LATER</button>
            <button id="import-sheet" type="button" data-copy="theme.tracker.import">IMPORT SHEET</button>
          </div>
        </div>
      </div>

      <div class="scroll" id="table-view">
        <table>
          <thead><tr>
            <th class="c-tgt" data-copy="theme.col.tgt">TGT</th>
            <th class="c-job" data-copy="theme.col.role">TARGET</th>
            <th class="c-status" data-copy="theme.col.status">STATUS</th>
            <th class="c-date" data-copy="theme.col.applied">SPLASH</th>
            <th class="c-src" data-copy="theme.col.source">SOURCE</th>
            <th class="c-notes" data-copy="theme.col.notes">NOTES</th>
            <th class="c-act" data-copy="theme.col.activity">ACTIVITY</th>
            <th class="c-go"></th>
          </tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div class="board" id="board" hidden></div>
    </section>

    <section id="intel-feed"></section>
  </main>

  <div class="shell-banner bottom" aria-hidden="true"><span data-copy="warroom.banner">CUI // CONTROLLED UNEMPLOYMENT INFORMATION</span></div>
  <div class="toast" id="toast" role="status"></div>
  <script type="module" src="tracker.js"></script>
</body>
</html>
