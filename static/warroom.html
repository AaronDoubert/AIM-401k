<!doctype html>
<html lang="en" data-mode="chud">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>WAR ROOM · AIM-401k</title>
  <link rel="icon" href="icons/icon-32.png" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="warroom.css" />
  <link rel="stylesheet" href="warroom-map.css" />
</head>
<body class="wr">
  <div class="wr-banner"><span data-copy="warroom.banner">CUI // CONTROLLED UNEMPLOYMENT INFORMATION</span></div>

  <header class="wr-head">
    <div class="brand">
      <img class="wordmark" src="brand/aim401k-wordmark-offwhite.svg" alt="AIM-401k" width="123" height="20" />
      <div class="brand-text">
        <h1 id="wr-title" data-copy="warroom.title">OPERATION GAINFUL</h1>
        <time id="wr-clock" class="clock">——————Z———</time>
      </div>
    </div>
    <div class="status">
      <span id="wr-live" class="lamp" data-state="live">LIVE</span>
      <span id="wr-afk-pip" class="lamp afk" hidden></span>
    </div>
    <button id="wr-caution" class="caution" type="button" data-lit="false">
      <span class="c-name" data-copy="warroom.caution">MASTER CAUTION</span>
      <span id="wr-caution-n" class="c-n"></span>
    </button>
    <nav class="ctl" aria-label="War Room controls">
      <button id="wr-afk" class="wr-btn toggle" type="button" aria-pressed="false" data-copy="warroom.ctl.afk">AWAY</button>
      <div class="stepper" role="group" aria-labelledby="wr-units-lbl">
        <span id="wr-units-lbl" class="lbl" data-copy="warroom.ctl.units">PARALLEL</span>
        <button id="wr-units-dec" class="wr-btn step" type="button" aria-label="Fewer parallel tabs">−</button>
        <output id="wr-units" aria-live="polite">1</output>
        <button id="wr-units-inc" class="wr-btn step" type="button" aria-label="More parallel tabs">+</button>
      </div>
      <button id="wr-pause" class="wr-btn" type="button" aria-pressed="false">PAUSE</button>
      <button id="wr-sound" class="wr-btn toggle" type="button" aria-pressed="false">SOUND OFF</button>
      <button id="wr-layer-map" class="wr-btn toggle" type="button" aria-pressed="false" aria-controls="wr-map-panel" data-copy="warroom.layer.map">MAP</button>
      <button id="wr-fs" class="wr-btn" type="button">FULL SCREEN</button>
    </nav>
  </header>

  <div id="wr-afk-strip" class="afk-strip" hidden><span data-copy="warroom.afk_strip"></span></div>

  <section class="wr-totals" aria-label="Stages">
    <div id="wr-stages"></div>
    <div class="rank"><span class="lbl" data-copy="warroom.rank.label">RANK</span> <b id="wr-rank">RECRUIT</b> <small id="wr-rank-next"></small></div>
  </section>

  <main class="wr-grid" id="warroom">
    <section class="col-main">
      <div class="sec-head"><h2 data-copy="warroom.units.title">TRACKS</h2></div>
      <div id="wr-tracks" class="tracks" role="table" hidden>
        <div class="track-head" role="row">
          <span data-copy="warroom.col.unit">UNIT</span>
          <span>TGT</span>
          <span data-copy="warroom.col.job">TARGET</span>
          <span data-copy="warroom.col.status">STATUS</span>
          <span data-copy="warroom.col.fields">FIELDS</span>
          <span data-copy="warroom.col.hold">HOLD</span>
          <span></span>
        </div>
        <div id="wr-track-list"></div>
      </div>
      <div id="wr-empty" class="empty">
        <b data-copy="warroom.units.empty">No tracks</b>
        <span data-copy="warroom.units.empty_sub"></span>
      </div>
    </section>

    <aside class="col-side">
      <section id="wr-map-panel" class="side-sec map-panel" hidden>
        <div class="sec-head"><h2 data-copy="warroom.map.title">AREA OF OPERATIONS</h2></div>
        <div id="wr-map"></div>
      </section>

      <section class="side-sec log-panel">
        <div class="sec-head"><h2 data-copy="warroom.log.title">OPS LOG</h2><div id="wr-chips" class="chips" role="group" aria-label="Filter the log"></div></div>
        <div class="log-wrap">
          <div id="wr-log" class="log" role="log" aria-live="polite" tabindex="0"></div>
          <button id="wr-log-new" class="log-new" type="button" hidden></button>
        </div>
      </section>

      <section class="side-sec arm-panel">
        <div class="sec-head"><h2><label for="wr-arm-input" data-copy="warroom.arm.title">ADD TARGETS</label></h2><span id="wr-arm-count" class="meta"></span></div>
        <textarea id="wr-arm-input" class="wr-input" rows="3" spellcheck="false" data-copy-placeholder="warroom.arm.placeholder"></textarea>
        <button id="wr-arm-go" class="wr-btn primary arm-go" type="button" data-copy="warroom.arm.go">QUEUE</button>
      </section>
    </aside>
  </main>

  <footer class="wr-foot"><span data-copy="warroom.footer"></span><span id="wr-ver" class="ver"></span></footer>
  <div class="wr-banner bottom" aria-hidden="true"><span data-copy="warroom.banner">CUI // CONTROLLED UNEMPLOYMENT INFORMATION</span></div>

  <div id="wr-modal" class="modal" hidden></div>
  <div class="toast" id="toast" role="status"></div>
  <script type="module" src="warroom.js"></script>
</body>
</html>
